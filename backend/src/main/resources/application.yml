server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: mairy-chat
  # 从 backend 启动时读取根目录 .env；系统环境变量优先。
  config:
    import: optional:file:../.env[.properties]
  jackson:
    # 统一 Jackson 时区；LocalDateTime 本身不带时区，写入仍由 ChatTime 负责。
    time-zone: Asia/Shanghai
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/mairy_chat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:mairy_chat_user}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 仅手动初始化本地数据库，启动时不改动任何数据库结构。
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

chat:
  allowed-origins: ${CHAT_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  # 助手凭证只从服务端环境注入，绝不使用 VITE_ 变量。
  ai:
    provider: spring-ai
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    # 超时单位为毫秒；两种 provider 共用，不增加 spring.ai 凭证配置。
    temperature: 0.3
    max-tokens: 2048
    connect-timeout: 10000
    read-timeout: 45000
    total-timeout: 120000
    daily-quota: 40
    sensitive-words: []

# SDK 的提示词、异常与 HTTP 调试日志可能含正文或凭证，关闭风险类别。
logging:
  level:
    org.springframework.ai: "OFF"
    org.springframework.web.reactive.function.client: "OFF"
    org.springframework.http.client: "OFF"
    reactor.netty: "OFF"
